<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#061006">
<title>Matrix Games Player</title>
<style>
:root{--neon:#00ff66;--neon-soft:#83ffad;--panel:rgba(3,18,7,.94);--line:rgba(0,255,102,.92);--arrow-size:1;--space-size:1;--edge:rgba(0,255,102,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020602;color:#eaffef;font-family:Arial,Tahoma,sans-serif;overscroll-behavior:none;touch-action:manipulation}
#player{position:fixed;inset:0;background:radial-gradient(ellipse at top,#0a2812 0%,#020602 58%);overflow:hidden}
/* وضع النافذة: إطار لعب داخل صفحة اللاعب. التكبير يمد هذا الإطار إلى الشاشة كاملة. */
#game-frame{position:absolute;top:calc(env(safe-area-inset-top,0px) + 132px);right:0;bottom:0;left:0;width:auto;height:auto;border:0;background:#000;z-index:1;overflow:hidden}
#game-heading{position:absolute;top:calc(env(safe-area-inset-top,0px) + 51px);left:8px;right:8px;min-height:72px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;z-index:6;pointer-events:none;border:1px solid rgba(0,255,102,.62);border-radius:13px;background:linear-gradient(110deg,rgba(3,23,8,.97),rgba(7,43,18,.97),rgba(2,15,5,.98));box-shadow:0 3px 14px rgba(0,0,0,.36),0 0 12px rgba(0,255,102,.08)}
#matrix-game-logo{width:36px;height:36px;flex:0 0 36px;object-fit:cover;border-radius:9px;border:1px solid rgba(0,255,102,.6);box-shadow:0 0 9px rgba(0,255,102,.16)}
#game-heading-copy{min-width:0;max-width:calc(100% - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;direction:rtl;text-align:center}
#game-title{margin:0;max-width:100%;font-size:16px;line-height:1.25;font-weight:800;color:#eaffef;white-space:normal;overflow-wrap:anywhere;text-shadow:0 0 8px rgba(0,255,102,.17)}
#game-description{margin:0;max-width:100%;font-size:12px;line-height:1.4;font-weight:500;color:#c0e8cb;white-space:normal;overflow-wrap:anywhere;text-align:center}
body.player-fullscreen #game-heading{display:none}
#player-ui{position:absolute;inset:0;z-index:20;pointer-events:none}
.ui-button,.control-button,.drag-handle,.settings-panel,.settings-toggle,.tools-panel,.menu-action{pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ui-button,.settings-toggle{position:relative;border:1px solid rgba(105,255,159,.78);color:#eaffef;background:linear-gradient(155deg,rgba(21,70,37,.98),rgba(3,22,9,.98) 58%,rgba(1,10,4,.99));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.55),0 2px 0 rgba(0,90,38,.9),0 0 10px rgba(0,255,102,.13);border-radius:11px;font-weight:700;font-size:13px;min-height:40px;padding:7px 10px;text-shadow:0 1px 2px #000}
.ui-button:active,.settings-toggle:active,.menu-action:active{transform:translateY(1px);background:linear-gradient(155deg,rgba(0,103,39,.98),rgba(2,37,14,.99));box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 0 10px rgba(0,255,102,.25)}
#top-actions{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;align-items:center;justify-content:flex-start;gap:7px;direction:rtl;flex-wrap:nowrap;z-index:30}
#top-actions .ui-button{white-space:nowrap}
#settings-toggle{min-width:42px;padding-inline:10px;font-size:16px}
#tools-toggle{min-width:76px;padding-inline:11px;font-size:12px;letter-spacing:.1px}
#settings-panel,.tools-panel{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 55px);right:8px;width:min(310px,calc(100vw - 16px));padding:13px;background:linear-gradient(155deg,rgba(3,24,10,.985),rgba(1,8,3,.99));border:1px solid var(--neon);border-radius:15px;box-shadow:0 12px 35px rgba(0,0,0,.58),0 0 20px rgba(0,255,102,.18);pointer-events:auto;font-size:14px;z-index:35;backdrop-filter:blur(12px)}
#settings-panel.open,.tools-panel.open{display:block}
.settings-title,.tools-title{font-weight:800;color:var(--neon-soft);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(0,255,102,.22);letter-spacing:.2px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.settings-row label{flex:1}
.settings-row input[type=range]{width:48%;accent-color:var(--neon)}
#show-controls{accent-color:var(--neon);width:18px;height:18px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools-panel{max-height:calc(100vh - 70px);overflow-y:auto}
.menu-action{min-height:43px;border:1px solid rgba(0,255,102,.55);border-radius:10px;color:#eaffef;background:linear-gradient(150deg,rgba(13,52,26,.96),rgba(2,16,6,.98));font-weight:700;font-size:12px;padding:8px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 2px 0 rgba(0,0,0,.4);text-align:center}
.menu-action:active{transform:translateY(1px);background:#075326}
.menu-action[hidden]{display:none!important}
#touch-layer{position:absolute;inset:0;pointer-events:none;z-index:25}
/* زر مثلث صغير داخل الصف العلوي؛ يبقى ظاهرًا عندما نخفي بقية الواجهة */
#controls-visibility-toggle{position:relative;flex:0 0 40px;width:40px;height:40px;min-height:40px;padding:0;display:flex;align-items:center;justify-content:center;z-index:32;pointer-events:auto;touch-action:manipulation;border:1px solid rgba(116,255,165,.92);border-radius:11px;color:#caffd9;background:linear-gradient(150deg,rgba(22,88,43,.99),rgba(1,18,7,.99));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.45),0 2px 0 rgba(0,90,38,.85),0 0 11px rgba(0,255,102,.2);font-size:17px;font-weight:900;line-height:1}
#controls-visibility-toggle:active{transform:translateY(1px);background:#08702b}
#controls-visibility-toggle .triangle{display:block;transition:transform .18s ease}
/* مربع الصح داخل الترس يتحكم في لوحة الأسهم وSPACE فقط. */
body.controls-hidden #dpad,body.controls-hidden #space-control{display:none!important}
/* المثلث العلوي يخفي أدوات الشريط فقط؛ لا يخفي لوحة الحركة أو SPACE. */
body.toolbar-hidden #top-actions > :not(#controls-visibility-toggle){display:none!important}
body.toolbar-hidden #settings-panel,body.toolbar-hidden .tools-panel{display:none!important}

#dpad{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 8px);width:calc(178px * var(--arrow-size));height:calc(192px * var(--arrow-size));pointer-events:auto;touch-action:none;filter:drop-shadow(0 7px 10px rgba(0,0,0,.42))}
.drag-handle{height:27px;width:100%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,255,102,.7);border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(25,78,41,.97),rgba(2,22,8,.97));color:#c6ffda;font-size:11px;letter-spacing:.2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
.dpad-grid{direction:ltr;height:calc(100% - 27px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;padding:7px;background:linear-gradient(145deg,rgba(6,28,12,.92),rgba(0,8,3,.93));border:1px solid rgba(0,255,102,.58);border-top:0;border-radius:0 0 14px 14px;box-shadow:inset 0 1px 7px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.025)}
.control-button{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-width:0;min-height:0;margin:0;padding:0;border:1px solid rgba(114,255,164,.88);border-radius:13px;color:#caffd9;background:linear-gradient(155deg,#1e6437 0%,#0a3219 42%,#031409 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -4px 6px rgba(0,0,0,.66),0 3px 0 #003a18,0 4px 7px rgba(0,0,0,.45),0 0 9px rgba(0,255,102,.15);font-size:calc(34px * var(--arrow-size));font-weight:900;line-height:1;text-align:center;text-shadow:0 2px 1px #001b09,0 0 8px rgba(0,255,102,.35);touch-action:none;overflow:hidden}
.control-button::before{content:"";position:absolute;inset:1px 2px auto;height:42%;border-radius:10px 10px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.control-button:active{transform:translateY(2px) scale(.985);color:#fff;background:linear-gradient(155deg,#23a34d 0%,#08702b 45%,#034019 100%);box-shadow:inset 0 3px 7px rgba(0,0,0,.6),0 1px 0 #003a18,0 0 15px rgba(0,255,102,.35)}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#right{grid-column:3;grid-row:2}#down{grid-column:2;grid-row:3}
#space-control{position:absolute;right:max(15px,env(safe-area-inset-right,0px));bottom:calc(max(20px,env(safe-area-inset-bottom,0px)) + 12px);width:calc(126px * var(--space-size));height:calc(76px * var(--space-size));display:flex;flex-direction:column;pointer-events:auto;touch-action:none;filter:drop-shadow(0 7px 10px rgba(0,0,0,.42))}
#space-drag{height:22px;border:1px solid rgba(0,255,102,.7);border-bottom:0;background:linear-gradient(180deg,rgba(25,78,41,.97),rgba(2,22,8,.97));border-radius:11px 11px 0 0;color:#c6ffda;font-size:10px;display:flex;align-items:center;justify-content:center}
#space-key{flex:1;border-radius:0 0 13px 13px;font-size:calc(16px * var(--space-size));letter-spacing:1.2px}
#game-message{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(0,0,0,.88);color:#d9ffe5;font-size:16px;line-height:1.7;pointer-events:auto}
#game-message.show{display:flex}
#exit-confirm{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);pointer-events:auto}
#exit-confirm.show{display:flex}
#exit-confirm-card{width:min(330px,100%);padding:22px 18px 18px;border:1px solid rgba(0,255,102,.9);border-radius:17px;background:linear-gradient(150deg,rgba(5,35,14,.98),rgba(1,10,4,.99));box-shadow:0 12px 36px rgba(0,0,0,.65),0 0 22px rgba(0,255,102,.15);text-align:center}
#exit-confirm-title{margin:0 0 9px;color:#eaffef;font-size:19px;font-weight:800}
#exit-confirm-text{margin:0 0 20px;color:#bfe8ca;font-size:14px;line-height:1.7}
#exit-confirm-actions{display:flex;gap:10px}
#exit-confirm-actions .menu-action{flex:1;font-size:14px}
#exit-confirm-yes{background:linear-gradient(150deg,rgba(0,105,43,.98),rgba(2,28,11,.99))}
#exit-confirm-no{background:linear-gradient(150deg,rgba(30,49,35,.98),rgba(8,16,10,.99))}
body.player-fullscreen #game-frame{inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
body.player-fullscreen #settings-panel,body.player-fullscreen .tools-panel{top:calc(env(safe-area-inset-top,0px) + 55px)}
@media (max-width:520px){#top-actions{left:6px;right:6px;gap:5px}#top-actions .ui-button,.settings-toggle{font-size:11px;min-height:38px;padding:6px 8px}#settings-toggle{min-width:37px;padding-inline:7px}
#tools-toggle{min-width:68px;padding-inline:8px;font-size:11px}#dpad{width:calc(158px * var(--arrow-size));height:calc(174px * var(--arrow-size));left:max(7px,env(safe-area-inset-left,0px));bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 6px)}.dpad-grid{gap:4px;padding:6px}.control-button{border-radius:11px}#space-control{right:max(8px,env(safe-area-inset-right,0px));bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 8px);width:calc(112px * var(--space-size));height:calc(68px * var(--space-size))}#game-heading{top:calc(env(safe-area-inset-top,0px) + 49px);left:4px;right:4px;min-height:76px;padding:7px 8px;gap:7px}#matrix-game-logo{width:34px;height:34px;flex-basis:34px;border-radius:7px}#game-heading-copy{max-width:calc(100% - 42px);gap:4px}#game-title{font-size:14px}#game-description{font-size:11px;line-height:1.35}.tools-grid{gap:6px}.menu-action{font-size:11px;padding:7px 4px}}
</style>
</head>
<body>
<div id="player">
  <iframe id="game-frame" title="Matrix Games game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
  <div id="player-ui">
    <div id="top-actions">
      <button class="ui-button" id="back-to-list" aria-label="الرجوع للقائمة">↩ خروج</button>
      <button class="ui-button" id="tools-toggle" aria-label="المزيد من أدوات اللعبة" aria-expanded="false">⋮ المزيد</button>
      <button class="settings-toggle" id="settings-toggle" aria-label="إعدادات التحكم" aria-expanded="false">⚙</button>
      <button class="ui-button" id="fullscreen-toggle" aria-label="تكبير مساحة اللعب">⛶ تكبير</button>
      <button id="controls-visibility-toggle" type="button" aria-label="إخفاء كل أزرار الواجهة" aria-pressed="false" title="إخفاء كل أزرار الواجهة"><span class="triangle">◀</span></button>
    </div>
    <div id="game-heading" aria-live="polite">
      <img id="matrix-game-logo" src="/assets/matrix-logo-192.jpg" alt="Matrix Games" onerror="this.onerror=null;this.src='/assets/matrix-favicon-48.png'">
      <div id="game-heading-copy">
        <h1 id="game-title">Matrix Games</h1>
        <p id="game-description">تحميل معلومات اللعبة...</p>
      </div>
    </div>
    <div class="tools-panel" id="tools-panel" aria-label="أدوات اللعبة">
      <div class="tools-title">أدوات اللعبة</div>
      <div class="tools-grid">
        <button class="menu-action" id="rotate-toggle">↻ تدوير الشاشة</button>
        <button class="menu-action" id="save-progress">▣ حفظ التقدم</button>
        <button class="menu-action" id="sync-progress">⟳ مزامنة التقدم</button>
        <button class="menu-action" id="login-account">♙ تسجيل الدخول</button>
        <button class="menu-action" id="logout-account" hidden>⇥ تسجيل الخروج</button>
      </div>
    </div>
    <div id="settings-panel">
      <div class="settings-title">إعدادات أزرار التحكم</div>
      <div class="settings-row"><label for="show-controls">إظهار الأسهم وSPACE</label><input id="show-controls" type="checkbox"></div>
      <div class="settings-row"><label for="arrow-size">حجم الأسهم</label><input id="arrow-size" type="range" min="0.65" max="1.5" step="0.05" value="1"></div>
      <div class="settings-row"><label for="space-size">حجم SPACE</label><input id="space-size" type="range" min="0.65" max="1.5" step="0.05" value="1"></div>
      <div style="font-size:11px;color:#b9d9c3;margin-top:8px">اسحب شريط «تحريك» لتحريك الأسهم، وشريط «تحريك SPACE» لتحريك زر المسافة.</div>
    </div>
    <div id="touch-layer">
      <div id="dpad">
        <div id="dpad-drag" class="drag-handle">⠿ تحريك الأسهم</div>
        <div class="dpad-grid">
          <button class="control-button" id="up" data-key="ArrowUp" aria-label="أعلى">▲</button>
          <button class="control-button" id="left" data-key="ArrowLeft" aria-label="تحريك اللاعب لليسار">◀</button>
          <button class="control-button" id="right" data-key="ArrowRight" aria-label="تحريك اللاعب لليمين">▶</button>
          <button class="control-button" id="down" data-key="ArrowDown" aria-label="أسفل">▼</button>
        </div>
      </div>
      <div id="space-control">
        <div id="space-drag" class="drag-handle">⠿ تحريك SPACE</div>
        <button class="control-button" id="space-key" data-key=" ">SPACE</button>
      </div>
    </div>
    <div id="game-message"></div>
    <div id="exit-confirm" role="dialog" aria-modal="true" aria-labelledby="exit-confirm-title">
      <div id="exit-confirm-card">
        <h2 id="exit-confirm-title">تأكيد الخروج</h2>
        <p id="exit-confirm-text">هل تريد الخروج من اللعبة والعودة إلى قائمة الألعاب؟</p>
        <div id="exit-confirm-actions">
          <button class="menu-action" id="exit-confirm-yes" type="button">نعم، خروج</button>
          <button class="menu-action" id="exit-confirm-no" type="button">لا، متابعة اللعب</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  const gameName = (params.get('game') || '').trim();
  const frame = document.getElementById('game-frame');
  const settingsPanel = document.getElementById('settings-panel');
  const settingsToggle = document.getElementById('settings-toggle');
  const toolsPanel = document.getElementById('tools-panel');
  const toolsToggle = document.getElementById('tools-toggle');
  const fullscreenToggle = document.getElementById('fullscreen-toggle');
  const showControlsInput = document.getElementById('show-controls');
  const arrowSizeInput = document.getElementById('arrow-size');
  const spaceSizeInput = document.getElementById('space-size');
  const message = document.getElementById('game-message');
  const exitConfirm = document.getElementById('exit-confirm');
  const exitConfirmYes = document.getElementById('exit-confirm-yes');
  const exitConfirmNo = document.getElementById('exit-confirm-no');
  const gameTitleElement = document.getElementById('game-title');
  const gameDescriptionElement = document.getElementById('game-description');
  const loginAccountButton = document.getElementById('login-account');
  const logoutAccountButton = document.getElementById('logout-account');
  let isFullscreen = false;
  let heldKeys = new Set();

  function unityCall(msg){try{if(window.Unity && typeof window.Unity.call==='function') window.Unity.call(msg);}catch(e){}}
  function showMessage(text){message.textContent=text;message.classList.add('show');}
  function prettyGameName(value){
    const name=String(value||'').replace(/[-_]+/g,' ').replace(/\\s+/g,' ').trim();
    const known={'1v1 lol':'1v1.LOL','fnaf':'FNAF','fnaf 2':'FNAF 2','fnaf 3':'FNAF 3','fnaf 4':'FNAF 4'};
    if(known[name.toLowerCase()]) return known[name.toLowerCase()];
    return name.replace(/\\b[a-z]/g,function(ch){return ch.toUpperCase();});
  }
  function updateGameHeading(){
    const fallbackName=prettyGameName(gameName);
    gameTitleElement.textContent=fallbackName || 'Matrix Games';
    gameDescriptionElement.textContent='العب ' + (fallbackName || 'هذه اللعبة') + ' مباشرةً على Matrix Games.';
    try{
      const doc=frame.contentDocument;
      if(!doc) return;
      const actualTitle=(doc.querySelector('meta[property="og:title"]')?.content || doc.title || '').trim();
      if(actualTitle && actualTitle.length<100 && !/^(index|game|offline html games pack)$/i.test(actualTitle)){
        gameTitleElement.textContent=actualTitle.replace(/\\s*[|–—-]\\s*(matrix games.*|play online.*)$/i,'').trim() || fallbackName;
      }
      const actualDescription=(
        doc.querySelector('meta[name="description"]')?.content ||
        doc.querySelector('meta[property="og:description"]')?.content ||
        doc.querySelector('[data-game-description]')?.textContent ||
        ''
      ).trim();
      if(actualDescription){
        gameDescriptionElement.textContent=actualDescription.replace(/\\s+/g,' ');
      }
    }catch(e){
      // بعض الألعاب قد تنتقل إلى نطاق خارجي؛ نحتفظ بالاسم والوصف الاحتياطيين.
    }
  }
  // Unity يستدعي هذه الدالة بعد تسجيل الدخول أو الخروج، من دون إعادة تحميل اللعبة.
  window.matrixSetSignedIn=function(signedIn){
    const authenticated=!!signedIn;
    if(loginAccountButton) loginAccountButton.hidden=authenticated;
    if(logoutAccountButton) logoutAccountButton.hidden=!authenticated;
  };
  if(!gameName || /[\\/]/.test(gameName) || gameName==='.' || gameName==='..'){
    showMessage('تعذر تحديد اللعبة. ارجع إلى القائمة وافتح اللعبة مرة أخرى.');
    return;
  }
  gameTitleElement.textContent=prettyGameName(gameName) || 'Matrix Games';
  gameDescriptionElement.textContent='العب ' + (prettyGameName(gameName) || 'هذه اللعبة') + ' مباشرةً على Matrix Games.';
  frame.addEventListener('load',function(){
    message.classList.remove('show');
    updateGameHeading();
  });
  frame.addEventListener('error',function(){showMessage('تعذر تحميل اللعبة. تحقق من الاتصال بالإنترنت ثم اضغط رجوع وأعد المحاولة.');});
  frame.src = '/offline/' + encodeURIComponent(gameName) + '.html';

  function dispatchKeyToWindow(win,key,type){
    try{
      const doc=win.document;
      if(!doc) return;
      let target=doc.activeElement;
      if(!target || target===doc.body || target===doc.documentElement){
        target=doc.querySelector('canvas, input, textarea, button, [tabindex]') || doc.body || doc;
      }
      try{if(win.focus) win.focus();}catch(e){}
      try{if(target && target.focus && target.tagName==='CANVAS') target.focus({preventScroll:true});}catch(e){}
      const info={key:key,code:key===' '?'Space':key,keyCode:key===' '?32:({ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40}[key]||0),which:key===' '?32:({ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40}[key]||0),bubbles:true,cancelable:true,composed:true,repeat:type==='keydown'&&heldKeys.has(key)};
      const event=new win.KeyboardEvent(type,info);
      // بعض ألعاب HTML القديمة تقرأ keyCode/which فقط.
      const numeric=info.keyCode;
      try{Object.defineProperty(event,'keyCode',{get:function(){return numeric;}});Object.defineProperty(event,'which',{get:function(){return numeric;}});}catch(e){}
      (target || doc).dispatchEvent(event);
    }catch(e){}
  }
  function visitFrames(win,key,type,depth){
    if(depth>5) return;
    dispatchKeyToWindow(win,key,type);
    try{
      const count=win.frames.length;
      for(let i=0;i<count;i++){
        try{visitFrames(win.frames[i],key,type,depth+1);}catch(e){}
      }
    }catch(e){}
  }
  function sendKey(key,type){
    if(type==='keydown') heldKeys.add(key); else heldKeys.delete(key);
    try{frame.contentWindow.focus();}catch(e){}
    try{visitFrames(frame.contentWindow,key,type,0);}catch(e){}
  }
  function releaseAllKeys(){Array.from(heldKeys).forEach(k=>sendKey(k,'keyup'));}
  document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAllKeys();});
  window.addEventListener('blur',releaseAllKeys);
  window.addEventListener('pagehide',releaseAllKeys);

  document.querySelectorAll('[data-key]').forEach(function(button){
    const key=button.getAttribute('data-key');
    button.addEventListener('contextmenu',e=>e.preventDefault());
    button.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      try{button.setPointerCapture(e.pointerId);}catch(ignore){}
      if(!heldKeys.has(key))sendKey(key,'keydown');
    });
    function release(e){if(e){e.preventDefault();e.stopPropagation();}if(heldKeys.has(key))sendKey(key,'keyup');}
    button.addEventListener('pointerup',release);
    button.addEventListener('pointercancel',release);
    button.addEventListener('lostpointercapture',release);
  });

  function clampPosition(el,left,top){
    const maxLeft=Math.max(0,window.innerWidth-el.offsetWidth);
    const maxTop=Math.max(0,window.innerHeight-el.offsetHeight);
    el.style.left=Math.max(0,Math.min(maxLeft,left))+'px';
    el.style.top=Math.max(0,Math.min(maxTop,top))+'px';
    el.style.right='auto';el.style.bottom='auto';
  }
  function attachDrag(handle,el,storageKey){
    let active=null,startX=0,startY=0,origX=0,origY=0,moved=false;
    handle.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      const rect=el.getBoundingClientRect();active=e.pointerId;startX=e.clientX;startY=e.clientY;origX=rect.left;origY=rect.top;moved=false;
      try{handle.setPointerCapture(active);}catch(ignore){}
    });
    handle.addEventListener('pointermove',function(e){
      if(active!==e.pointerId)return;
      e.preventDefault();
      if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>3)moved=true;
      clampPosition(el,origX+e.clientX-startX,origY+e.clientY-startY);
    });
    function end(e){if(active!==null && (!e || e.pointerId===active)){if(moved){try{localStorage.setItem(storageKey,JSON.stringify({left:el.style.left,top:el.style.top}));}catch(ignore){}}active=null;}}
    handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('lostpointercapture',end);
  }
  const dpad=document.getElementById('dpad');
  const spaceControl=document.getElementById('space-control');
  attachDrag(document.getElementById('dpad-drag'),dpad,'matrix.player.dpad.position');
  attachDrag(document.getElementById('space-drag'),spaceControl,'matrix.player.space.position');
  function restorePosition(el,key){try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&v.left&&v.top)clampPosition(el,parseFloat(v.left),parseFloat(v.top));}catch(e){}}
  function loadSettings(){
    try{
      // الإعداد الجديد يبدأ بإخفاء الأسهم وSPACE، ولا يظهران إلا بعد تفعيل الخيار يدويًا.
      showControlsInput.checked=localStorage.getItem('matrix.player.controls.v2')==='true';
      arrowSizeInput.value=localStorage.getItem('matrix.player.arrowSize')||'1';
      spaceSizeInput.value=localStorage.getItem('matrix.player.spaceSize')||'1';
    }catch(e){}
    applyControlSettings();
    restorePosition(dpad,'matrix.player.dpad.position');
    restorePosition(spaceControl,'matrix.player.space.position');
  }
  function applyControlSettings(){
    document.documentElement.style.setProperty('--arrow-size',arrowSizeInput.value);
    document.documentElement.style.setProperty('--space-size',spaceSizeInput.value);
    // علامة الصح في الترس تتحكم في الأسهم وSPACE فقط.
    document.body.classList.toggle('controls-hidden',!showControlsInput.checked);
    try{localStorage.setItem('matrix.player.controls.v2',String(showControlsInput.checked));localStorage.setItem('matrix.player.arrowSize',arrowSizeInput.value);localStorage.setItem('matrix.player.spaceSize',spaceSizeInput.value);}catch(e){}
  }
  function setToolbarHidden(hidden){
    const shouldHide=!!hidden;
    document.body.classList.toggle('toolbar-hidden',shouldHide);
    const toggle=document.getElementById('controls-visibility-toggle');
    toggle.setAttribute('aria-pressed',String(shouldHide));
    toggle.setAttribute('aria-label',shouldHide?'إظهار أدوات الشريط العلوي':'إخفاء أدوات الشريط العلوي');
    toggle.title=shouldHide?'إظهار أدوات الشريط العلوي':'إخفاء أدوات الشريط العلوي';
    toggle.querySelector('.triangle').textContent=shouldHide?'▶':'◀';
    if(shouldHide){
      settingsPanel.classList.remove('open');
      toolsPanel.classList.remove('open');
      settingsToggle.setAttribute('aria-expanded','false');
      toolsToggle.setAttribute('aria-expanded','false');
    }
    try{localStorage.setItem('matrix.player.toolbarHidden',String(shouldHide));}catch(e){}
  }
  document.getElementById('controls-visibility-toggle').addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    setToolbarHidden(!document.body.classList.contains('toolbar-hidden'));
  });
  showControlsInput.addEventListener('change',applyControlSettings);
  arrowSizeInput.addEventListener('input',applyControlSettings);
  spaceSizeInput.addEventListener('input',applyControlSettings);
  const closeTopPanels=function(){
    settingsPanel.classList.remove('open');
    toolsPanel.classList.remove('open');
    settingsToggle.setAttribute('aria-expanded','false');
    toolsToggle.setAttribute('aria-expanded','false');
  };
  function openExitConfirm(){
    closeTopPanels();
    exitConfirm.classList.add('show');
    exitConfirmYes.focus();
  }
  function closeExitConfirm(){
    exitConfirm.classList.remove('show');
    const backButton=document.getElementById('back-to-list');
    if(backButton) backButton.focus();
  }
  document.getElementById('back-to-list').addEventListener('click',function(e){e.preventDefault();openExitConfirm();});
  exitConfirmYes.addEventListener('click',function(){closeExitConfirm();unityCall('matrix_back');});
  exitConfirmNo.addEventListener('click',closeExitConfirm);
  exitConfirm.addEventListener('click',function(e){if(e.target===exitConfirm)closeExitConfirm();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&exitConfirm.classList.contains('show')){e.preventDefault();closeExitConfirm();}});
  settingsToggle.addEventListener('click',function(e){
    e.preventDefault();
    const opening=!settingsPanel.classList.contains('open');
    closeTopPanels();
    if(opening){settingsPanel.classList.add('open');settingsToggle.setAttribute('aria-expanded','true');}
  });
  toolsToggle.addEventListener('click',function(e){
    e.preventDefault();
    const opening=!toolsPanel.classList.contains('open');
    closeTopPanels();
    if(opening){toolsPanel.classList.add('open');toolsToggle.setAttribute('aria-expanded','true');}
  });
  document.addEventListener('pointerdown',function(e){
    if(!settingsPanel.contains(e.target)&&e.target!==settingsToggle&&
       !toolsPanel.contains(e.target)&&e.target!==toolsToggle) closeTopPanels();
  });
  document.getElementById('rotate-toggle').addEventListener('click',function(){closeTopPanels();unityCall('matrix_rotate');});
  document.getElementById('save-progress').addEventListener('click',function(){closeTopPanels();unityCall('matrix_save_progress');});
  document.getElementById('sync-progress').addEventListener('click',function(){closeTopPanels();unityCall('matrix_sync_progress');});
  document.getElementById('login-account').addEventListener('click',function(){closeTopPanels();unityCall('matrix_login');});
  document.getElementById('logout-account').addEventListener('click',function(){closeTopPanels();unityCall('matrix_logout');});

  function setFullscreen(enabled){
    isFullscreen=!!enabled;
    document.body.classList.toggle('player-fullscreen',isFullscreen);
    fullscreenToggle.textContent=isFullscreen?'⤢ تصغير':'⛶ تكبير';
    fullscreenToggle.setAttribute('aria-label',isFullscreen?'تصغير مساحة اللعب':'تكبير مساحة اللعب');
    unityCall(isFullscreen?'matrix_player_fullscreen_on':'matrix_player_fullscreen_off');
    try{localStorage.setItem('matrix.player.fullscreen',String(isFullscreen));}catch(e){}
  }
  fullscreenToggle.addEventListener('click',function(){setFullscreen(!isFullscreen);});
  // الضغط المطوّل على زر الأدوات يظل اختصارًا للخروج، دون تعطيل فتح القائمة بالنقر العادي.
  toolsToggle.addEventListener('contextmenu',function(e){e.preventDefault();unityCall('matrix_back');});
  window.addEventListener('resize',function(){
    [dpad,spaceControl].forEach(function(el){const r=el.getBoundingClientRect();clampPosition(el,r.left,r.top);});
  });
  loadSettings();
  let savedToolbarHidden=false;
  try{savedToolbarHidden=localStorage.getItem('matrix.player.toolbarHidden')==='true';}catch(e){}
  setToolbarHidden(savedToolbarHidden);
})();
</script>
</body>
</html>
